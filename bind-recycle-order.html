<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>选择回收单 - 联想商城</title>
<script>if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('embed')</script>
<style>
:root{--brand:#d52b2b;--brand-light:#fff2f2;--text:#1f1f1f;--muted:#858585;--line:#e8e8e8;--page:#f5f5f5}
*{box-sizing:border-box}
html,body{margin:0;min-width:1200px;min-height:100%;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;color:var(--text);background:var(--page)}
button,input{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
.site-header{height:72px;background:#fff;border-bottom:1px solid #ececec}
.header-inner{width:1200px;height:72px;margin:0 auto;display:flex;align-items:center}
.brand{display:flex;align-items:center;text-decoration:none;color:var(--text)}
.brand img{display:block;width:178px;height:auto}
.brand-divider{width:1px;height:24px;margin:0 22px;background:#dedede}
.brand-title{font-size:17px;font-weight:500}
.header-spacer{flex:1}
.header-link{margin-left:30px;color:#666;font-size:13px;text-decoration:none}
.header-link:hover{color:var(--brand)}
.breadcrumb{width:1200px;margin:18px auto 0;color:#8c8c8c;font-size:12px}
.breadcrumb a{color:#666;text-decoration:none}
.breadcrumb a:hover{color:var(--brand)}
.page-heading{width:1200px;margin:24px auto 20px}
.page-heading h1{margin:0;font-size:27px;line-height:40px;font-weight:600}
.page-heading p{margin:8px 0 0;color:#777;font-size:13px}
.layout{width:1200px;margin:0 auto 64px;display:grid;grid-template-columns:820px 356px;gap:24px;align-items:stretch}
.panel{background:#fff;border-radius:2px}
.orders-panel{padding:24px 28px 28px}
.notice{display:flex;align-items:center;min-height:52px;padding:13px 16px;border-radius:2px;background:var(--brand-light);color:#555;font-size:13px;line-height:24px}
.notice-icon{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;margin-right:10px;border-radius:50%;color:var(--brand);font-size:17px;flex:0 0 auto}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 14px}
.section-head h2{margin:0;font-size:19px;line-height:30px;font-weight:600}
.section-count{color:#999;font-size:12px}
.order-list{display:grid;gap:14px}
.order-card{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 230px;column-gap:32px;align-items:center;padding:20px 22px 18px 62px;border:1px solid #dedede;border-radius:2px;background:#fff;cursor:pointer;transition:border-color .16s,box-shadow .16s}
.order-card:hover{border-color:#aaa}
.order-card.is-selected{border-color:var(--brand);box-shadow:0 0 0 1px rgba(226,35,26,.04)}
.order-radio{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
.radio-mark{position:absolute;left:24px;top:50%;width:20px;height:20px;border:1px solid #c8cdd2;border-radius:50%;background:#fff;transform:translateY(-50%)}
.order-card.is-selected .radio-mark{border-color:var(--brand);background:var(--brand)}
.order-card.is-selected .radio-mark::after{content:"";position:absolute;left:6px;top:3px;width:5px;height:9px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg)}
.order-top{grid-column:1;grid-row:1;display:grid;gap:0;align-self:center;min-width:0}
.device-name{font-size:16px;line-height:26px;font-weight:600}
.order-number{margin:0;color:#8b8b8b;font-size:12px;line-height:22px}
.order-values{grid-column:2;grid-row:1;align-self:center;display:grid;grid-template-columns:1fr;gap:10px;margin:0;padding:0;border:0}
.value-cell{display:flex;align-items:baseline;justify-content:space-between;gap:14px;text-align:right}
.value-label{display:inline;color:#8a8a8a;font-size:12px;line-height:20px;white-space:nowrap}
.value-amount{display:inline;margin:0;color:#111;font-size:20px;line-height:28px;font-weight:600;white-space:nowrap}
.value-amount.subsidy{color:var(--brand)}
.add-device{width:100%;height:62px;margin-top:18px;padding:0 20px;display:flex;align-items:center;border:1px dashed #d6d6d6;border-radius:2px;background:#fafafa;cursor:pointer;color:#858585;font-size:15px}
.add-device:hover{border-color:var(--brand);background:#fff8f8}
.add-device strong{margin-left:auto;color:var(--brand);font-size:13px;font-weight:500}
.add-device-arrow{width:7px;height:7px;margin-left:9px;border-top:1px solid #aaa;border-right:1px solid #aaa;transform:rotate(45deg)}
.summary-panel{position:sticky;top:20px;padding:24px}
.summary-panel h2{margin:0 0 20px;font-size:19px;font-weight:600}
.summary-block{padding:16px;background:#fafafa;border-radius:2px}
.summary-label{display:block;margin-bottom:7px;color:#8a8a8a;font-size:11px}
.summary-product{font-size:13px;line-height:22px;color:#3a3a3a}
.summary-order{margin-top:14px;padding-top:14px;border-top:1px solid #e7e7e7}
.summary-device{font-size:14px;line-height:23px;font-weight:600}
.summary-number{margin-top:3px;color:#888;font-size:11px}
.subsidy-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:22px;padding:18px 0}
.subsidy-copy strong{display:block;font-size:15px;line-height:24px;font-weight:600}
.subsidy-copy span{display:block;margin-top:4px;color:#999;font-size:11px}
.subsidy-price{color:var(--brand);font-size:26px;line-height:32px;font-weight:700}
.subsidy-price small{font-size:15px}
.submit-button{width:100%;height:48px;margin-top:22px;border:0;border-radius:2px;background:var(--brand);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.submit-button:hover{background:var(--brand)}
.submit-button:active{transform:translateY(1px)}
.submit-button:disabled,.submit-button:disabled:hover{background:#d7d7d7;color:#fff;cursor:not-allowed;transform:none}
.agreement{display:flex;align-items:center;gap:6px;margin:12px 0 0;color:#777;font-size:11px;line-height:20px;white-space:nowrap;text-align:left;cursor:pointer}
.agreement input{position:relative;width:14px;height:14px;margin:0;appearance:none;-webkit-appearance:none;border:1px solid #999;border-radius:50%;background:#fff;cursor:pointer;flex:0 0 auto}
.agreement input:checked{border-color:var(--brand);background:var(--brand)}
.agreement input:checked::after{content:"";position:absolute;left:4px;top:2px;width:3px;height:6px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg)}
.agreement a{color:#777;text-decoration:none}
.agreement a:hover{color:var(--brand)}
.summary-actions{width:100%}
.toast{position:fixed;left:50%;bottom:40px;z-index:10;max-width:520px;padding:13px 22px;border-radius:4px;background:rgba(24,24,24,.9);color:#fff;font-size:13px;line-height:22px;opacity:0;transform:translate(-50%,16px);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.is-visible{opacity:1;transform:translate(-50%,0)}
@media(max-height:760px){.summary-panel{top:12px}.page-heading{margin-top:18px}.layout{margin-bottom:36px}}
html.embed,html.embed body{min-width:0;width:100%;height:100%;overflow:hidden;background:#fff}
html.embed .site-header,html.embed .breadcrumb,html.embed .page-heading{display:none}
html.embed .layout{display:block;width:auto;height:100%;margin:0;padding:16px 18px 18px;overflow-x:hidden;overflow-y:auto;background:#fff}
html.embed .panel,html.embed .notice,html.embed .order-card,html.embed .add-device,html.embed .summary-block,html.embed .submit-button{border-radius:2px}
html.embed .orders-panel{height:auto;padding:0;overflow:visible}
html.embed .notice{min-height:40px;padding:8px 10px;background:#fff8f8;font-size:12px;line-height:20px}
html.embed .notice-icon{width:20px;height:20px;margin-right:6px;font-size:14px}
html.embed .section-head{margin:12px 0 8px}
html.embed .section-head h2{font-size:16px;line-height:24px}
html.embed .section-count{font-size:11px}
html.embed .order-list{gap:8px}
html.embed .order-card{grid-template-columns:minmax(0,1fr) 190px;column-gap:16px;padding:11px 12px 10px 43px}
html.embed .radio-mark{left:15px;top:50%;width:17px;height:17px}
html.embed .order-card.is-selected .radio-mark::after{left:5px;top:2px;width:4px;height:8px}
html.embed .device-name{font-size:14px;line-height:20px}
html.embed .order-number{margin-top:0;font-size:11px;line-height:18px}
html.embed .order-values{grid-template-columns:minmax(0,1fr) max-content;column-gap:14px;row-gap:3px;align-items:baseline;margin:0;padding:0;border:0}
html.embed .value-cell{display:contents}
html.embed .value-label{position:relative;left:2px;font-size:11px;line-height:17px}
html.embed .value-amount{margin:0;text-align:left;font-size:16px;line-height:22px}
html.embed .add-device{height:40px;margin-top:8px;padding:0 12px;font-size:12px}
html.embed .add-device strong{font-size:12px}
html.embed .summary-panel{position:relative;top:0;height:auto;display:block;margin-top:14px;padding:0;border-left:0;border-radius:2px}
html.embed .summary-panel h2{margin:0 0 10px;font-size:16px;line-height:24px}
html.embed .summary-block{width:100%;padding:12px 14px;background:#fafafa}
html.embed .summary-label{margin-bottom:4px;font-size:10px}
html.embed .summary-product{font-size:12px;line-height:18px}
html.embed .summary-order{margin-top:8px;padding-top:8px}
html.embed .summary-device{font-size:13px;line-height:18px}
html.embed .summary-number{font-size:10px}
html.embed .subsidy-row{margin-top:10px;padding:11px 14px;border:1px solid #ffe1e1;border-radius:2px;background:#fff8f8}
html.embed .subsidy-copy strong{font-size:13px;line-height:19px}
html.embed .subsidy-copy span{margin-top:1px;font-size:10px}
html.embed .subsidy-price{font-size:22px;line-height:26px}
html.embed .summary-actions{position:static;margin-top:8px;padding:0;border-top:0;background:#fff;box-shadow:none}
html.embed .agreement{width:100%;justify-content:flex-start;margin:0;font-size:11px;line-height:18px;text-align:left}
html.embed .agreement input{position:relative;width:14px;height:14px;margin:0;appearance:none;-webkit-appearance:none;border:1px solid #999;border-radius:50%;background:#fff;cursor:pointer}
html.embed .agreement input:checked{border-color:var(--brand);background:var(--brand)}
html.embed .agreement input:checked::after{content:"";position:absolute;left:4px;top:2px;width:3px;height:6px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg)}
html.embed .submit-button{display:block;width:180px;height:38px;margin:9px 0 0 auto;font-size:13px}
</style>
</head>
<body>
<header class="site-header">
<div class="header-inner">
<a class="brand" href="index.html" aria-label="返回联想商品详情">
<img src="assets/skz7mq0zavm0hd8xfaq0nrofxcwje3959207.png" alt="Lenovo">
<span class="brand-divider" aria-hidden="true"></span>
<span class="brand-title">以旧换新</span>
</a>
<span class="header-spacer"></span>
<a class="header-link" id="returnLink" href="index.html">返回商品详情</a>
</div>
</header>
<nav class="breadcrumb" aria-label="面包屑">
<a id="breadcrumbLink" href="index.html">商品详情</a><span> &gt; 选择回收单</span>
</nav>
<div class="page-heading">
<h1>选择回收单</h1>
<p>选择待收货的回收单与当前新商品订单绑定，回收完成后返还换新补贴。</p>
</div>
<main class="layout">
<section class="panel orders-panel" aria-labelledby="pending-orders-title">
<div class="notice"><span class="notice-icon" aria-hidden="true">♻</span><span>仅展示当前账号下符合条件的待完成回收单，绑定后不可更换。</span></div>
<div class="section-head">
<h2 id="pending-orders-title">待完成回收单</h2>
<span class="section-count">共 2 单</span>
</div>
<div class="order-list">
<label class="order-card is-selected" data-device="拯救者 Y9000P 2023款 i9 RTX4060" data-number="RO20260820001" data-subsidy="260">
<input class="order-radio" type="radio" name="recycle-order" value="RO20260820001" checked>
<span class="radio-mark" aria-hidden="true"></span>
<span class="order-top"><span class="device-name">拯救者 Y9000P 2023款 i9 RTX4060</span><span class="order-number">回收单号：RO20260820001</span></span>
<span class="order-values">
<span class="value-cell"><span class="value-label">回收预估</span><strong class="value-amount">¥3,940</strong></span>
<span class="value-cell"><span class="value-label">绑定后预计换新补贴</span><strong class="value-amount subsidy">¥260</strong></span>
</span>
</label>
<label class="order-card" data-device="ThinkBook 14 2022款 i5" data-number="RO20260823002" data-subsidy="260">
<input class="order-radio" type="radio" name="recycle-order" value="RO20260823002">
<span class="radio-mark" aria-hidden="true"></span>
<span class="order-top"><span class="device-name">ThinkBook 14 2022款 i5</span><span class="order-number">回收单号：RO20260823002</span></span>
<span class="order-values">
<span class="value-cell"><span class="value-label">回收预估</span><strong class="value-amount">¥1,600</strong></span>
<span class="value-cell"><span class="value-label">绑定后预计换新补贴</span><strong class="value-amount subsidy">¥260</strong></span>
</span>
</label>
</div>
<button class="add-device" id="addDevice" type="button"><span>没有可绑定的回收单？</span><strong>添加旧机</strong><span class="add-device-arrow" aria-hidden="true"></span></button>
</section>
<aside class="panel summary-panel" aria-labelledby="summary-title">
<h2 id="summary-title">绑定信息</h2>
<div class="summary-block">
<span class="summary-label">当前购买商品</span>
<div class="summary-product" id="summaryProduct">联想拯救者 Y7000P 2026 16英寸电竞游戏笔记本电脑</div>
<div class="summary-order">
<span class="summary-label">已选回收单</span>
<div class="summary-device" id="summaryDevice">拯救者 Y9000P 2023款 i9 RTX4060</div>
<div class="summary-number" id="summaryNumber">RO20260820001</div>
</div>
</div>
<div class="subsidy-row">
<div class="subsidy-copy"><strong>绑定后返换新补贴</strong><span>旧机回收成功后返</span></div>
<div class="subsidy-price"><small>¥</small><span id="summarySubsidy">260</span></div>
</div>
<div class="summary-actions">
<label class="agreement" for="agreementCheck"><input id="agreementCheck" type="checkbox"><span>我已阅读并同意<a href="#">《以旧换新服务协议》</a></span></label>
<button class="submit-button" id="bindAndBuy" type="button" disabled>绑定回收单并购买</button>
</div>
</aside>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
const cards=[...document.querySelectorAll('.order-card')];
const query=new URLSearchParams(location.search);
const isEmbedded=query.get('embed')==='1';
const embeddedLayout=isEmbedded?document.querySelector('.layout'):null;
function resetEmbeddedScroll(){
if(!embeddedLayout)return;
embeddedLayout.scrollTop=0;
window.scrollTo(0,0);
}
if(isEmbedded){
if('scrollRestoration' in history)history.scrollRestoration='manual';
window.addEventListener('pageshow',resetEmbeddedScroll);
requestAnimationFrame(resetEmbeddedScroll);
}
const productProfiles={
r9000x:{name:'联想 拯救者R9000X 2026 15.3英寸电竞游戏笔记本电脑 星烁紫',price:'21499'},
'yoga-air-14':{name:'YOGA Air 14 Ultra Aura 2026 14英寸轻薄笔记本电脑 云绢',price:'21499'},
y7000x:{name:'联想拯救者Y7000X 2026 15.3英寸电竞游戏本笔记本电脑 碳晶黑',price:'12999'},
y7000p:{name:'联想拯救者 Y7000P 2026 16英寸电竞游戏笔记本电脑 碳晶黑',price:'15469'}
};
const productKey=productProfiles[query.get('product')]?query.get('product'):'y7000p';
const currentProduct=productProfiles[productKey];
document.getElementById('summaryProduct').textContent=currentProduct.name;
if(query.get('source')==='cart'){
document.title=`${currentProduct.name} - 以旧换新`;
const returnLink=document.getElementById('returnLink');
const breadcrumbLink=document.getElementById('breadcrumbLink');
returnLink.href='cart.html';returnLink.textContent='返回购物车';
breadcrumbLink.href='cart.html';breadcrumbLink.textContent='购物车';
}
const summaryDevice=document.getElementById('summaryDevice');
const summaryNumber=document.getElementById('summaryNumber');
const summarySubsidy=document.getElementById('summarySubsidy');
const agreementCheck=document.getElementById('agreementCheck');
const bindAndBuy=document.getElementById('bindAndBuy');
const toast=document.getElementById('toast');
let toastTimer;
function showToast(message){
toast.textContent=message;
toast.classList.add('is-visible');
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>toast.classList.remove('is-visible'),2400);
}
function selectCard(card){
cards.forEach(item=>item.classList.toggle('is-selected',item===card));
card.querySelector('input').checked=true;
summaryDevice.textContent=card.dataset.device;
summaryNumber.textContent=card.dataset.number;
summarySubsidy.textContent=card.dataset.subsidy;
}
cards.forEach(card=>card.addEventListener('change',()=>selectCard(card)));
document.getElementById('addDevice').addEventListener('click',()=>showToast('跳转服务侧机型选择页'));
agreementCheck.addEventListener('change',()=>{bindAndBuy.disabled=!agreementCheck.checked});
bindAndBuy.addEventListener('click',()=>{
const selected=document.querySelector('.order-card.is-selected');
const params=new URLSearchParams({
recycleOrder:selected.dataset.number,
device:selected.dataset.device,
subsidy:selected.dataset.subsidy,
product:productKey
});
if(query.get('source'))params.set('source',query.get('source'));
const destination=`settlement-center.html?${params.toString()}`;
if(isEmbedded&&window.parent!==window)window.parent.location.href=destination;else window.location.href=destination;
});
document.querySelector('.agreement a').addEventListener('click',event=>{event.preventDefault();event.stopPropagation();showToast('服务协议内容将在后续接入')});
})();
</script>
</body>
</html>
