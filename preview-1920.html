<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>1920×1080 桌面预览</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee}iframe{width:1920px;height:1080px;border:0;transform-origin:top left;position:absolute;left:0;top:0;background:white}</style></head><body><iframe src="index.html" title="联想商品页 1920×1080"></iframe><script>function fit(){let s=Math.min(innerWidth/1920,innerHeight/1080);let f=document.querySelector('iframe');f.style.transform=`scale(${s})`;f.style.left=(innerWidth-1920*s)/2+'px';f.style.top=(innerHeight-1080*s)/2+'px'};onresize=fit;fit();</script></body></html>
